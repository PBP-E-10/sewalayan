{% extends 'base.html' %}

{% block meta %}
<title>Edit Ulasan | Sewalayan</title>
{% endblock %}

{% block content %}
<section class="section">
    <h1 class="section__title">Edit Ulasan</h1>

    <form method="POST" class="card stack">
        {% csrf_token %}
        {% for field in form %}
            <div class="stack stack--sm">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <small class="text-sm text-muted">{{ error }}</small>
                {% endfor %}
            </div>
        {% endfor %}
        <div class="row">
            <button type="submit" class="btn btn--primary">Simpan Perubahan</button>
            <a href="{% url 'review:show' %}" class="btn">Batal</a>
        </div>
    </form>
</section>
{% endblock %}
