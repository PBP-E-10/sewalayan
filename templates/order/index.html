{% extends "base.html" %}

{% block meta %}
<title>Order</title>
{% endblock %}

{% block content %}
<h1>Kelola Penyewaan</h1>
<div class="grid grid--sm container-padding" id="order-tabs">
    <button 
        type="button" 
        class="btn btn--primary" 
        onclick="handleTabChange(this, true, 'all', 'Sewaan')">
        Sewaan
    </button>

    <button 
        type="button" 
        class="btn" 
        onclick="handleTabChange(this, false, 'all', 'Disewakan')">
        Disewakan
    </button>
</div>

<section class="section">
    <h2 class="section__title" id="section-title">Sewaan</h2>

    <div class="text-center">
        <div id="loading" hidden>
            <p class="text-muted">Memuat daftar order...</p>
        </div>
        <div id="error" hidden>
            <p class="text-danger">Gagal memuat data order dari server. Silakan coba beberapa saat lagi.</p>
        </div>
        <div id="empty" hidden>
            <p>Tidak ada data.</p>
        </div>
    </div>

    <div id="results" class="stack" hidden>
    </div>
</section>

<script>
    const ORDERS_ENDPOINT = "{% url 'order:api:json' %}";
    const ORDER_DETAIL_URL_TEMPLATE = "{% url 'order:detail' '00000000-0000-0000-0000-000000000000' %}";
    const ITEM_DETAIL_URL_TEMPLATE = "{% url 'item:detail' '0' %}"

    let ordersAbortController;
    let currentTabState = { isBuyer: true, status: 'all', title: 'Sewaan' };

    const ordersLoadingState = document.getElementById('loading');
    const ordersErrorState = document.getElementById('error');
    const ordersEmptyState = document.getElementById('empty');
    const ordersContainer = document.getElementById('results');
    const sectionTitleElement = document.getElementById('section-title');

    function displayOrdersSection({ showLoading = false, showError = false, showEmpty = false, showContainer = false }) {
        if (ordersLoadingState) ordersLoadingState.hidden = !showLoading;
        if (ordersErrorState) ordersErrorState.hidden = !showError;
        if (ordersEmptyState) ordersEmptyState.hidden = !showEmpty;
        if (ordersContainer) ordersContainer.hidden = !showContainer;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatRupiah(value) {
        const number = Number(value);
        if (Number.isNaN(number)) return escapeHtml(value);
        return number.toLocaleString('id-ID', { maximumFractionDigits: 0 });
    }

    function formatDate(isoString) {
        if (!isoString) return '—';
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return escapeHtml(isoString);
        return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function buildOrderCardElement(order, isBuyer) {
        const fields = order.fields;

        let detailUrl = "";

        if (isBuyer === true) {
            detailUrl = ORDER_DETAIL_URL_TEMPLATE.replace(
                "00000000-0000-0000-0000-000000000000",
                String(order.id)
            );
        } else {
            detailUrl = ITEM_DETAIL_URL_TEMPLATE.replace(
                "0",
                String(fields.item_id)
            );
        }

        let partyLabel = "";
        if (isBuyer === true) {
            partyLabel = `<p>Pemilik: ${escapeHtml(fields.owner_name || fields.owner || "—")}</p>`;
        } else {
            partyLabel = `<p>Penyewa: ${escapeHtml(fields.buyer_name || fields.buyer || "—")}</p>`;
        }

        const article = document.createElement("article");
        article.className = "card stack stack--sm";

        const detailButtonHtml = `<a href="${escapeHtml(detailUrl)}" class="btn btn--primary">Detail</a>`

        article.innerHTML = `
            <div class="row row--between">
                <h3>${escapeHtml(fields.item_name)}</h3>
                <strong>
                    ${escapeHtml(fields.status)}
                </strong>
            </div>
            ${partyLabel}
            <p>Ambil: ${formatDate(fields.taken_at)}</p>
            <p>Kembali: ${formatDate(fields.returned_at)}</p>
            <div class="row row--between">
                <strong class="text-lg">
                    Rp${formatRupiah(fields.purchase_price)} <span class="text-sm text-muted">/hari</span>
                </strong>
                <div class="row">
                    ${detailButtonHtml}
                </div>
            </div>
        `;

        return article;
    }

    async function fetchOrders({ isBuyer = true, status = 'all', title = 'Sewaan' } = {}) {
        currentTabState = { isBuyer, status, title };

        if (sectionTitleElement) {
            sectionTitleElement.textContent = title;
        }

        if (ordersAbortController) ordersAbortController.abort();
        ordersAbortController = new AbortController();

        try {
            displayOrdersSection({ showLoading: true });

            const params = new URLSearchParams({
                buyer: isBuyer ? 'true' : 'false',
            });
            if (status && status !== 'all') {
                params.append('status', status);
            }

            const response = await fetch(`${ORDERS_ENDPOINT}?${params.toString()}`, {
                headers: { 'Accept': 'application/json' },
                signal: ordersAbortController.signal,
            });

            if (!response.ok) throw new Error('Gagal memuat data pesanan');

            const orderData = await response.json();
            ordersContainer.innerHTML = "";

            if (orderData.length === 0) {
                displayOrdersSection({ showEmpty: true });
            } else {
                orderData.forEach(order => ordersContainer.appendChild(buildOrderCardElement(order, isBuyer)));
                displayOrdersSection({ showContainer: true });
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Error fetching orders:', error);
            displayOrdersSection({ showError: true });
        }
    }

    function handleTabChange(clickedBtn, isBuyer, status, title) {
        const tabs = document.querySelectorAll('#order-tabs .btn');
        tabs.forEach(btn => btn.classList.remove('btn--primary'));
        
        clickedBtn.classList.add('btn--primary');
        fetchOrders({ isBuyer, status, title });
    }

    fetchOrders({ isBuyer: true, status: 'all', title: 'Sewaan' });
</script>
{% endblock %}
