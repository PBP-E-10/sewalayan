<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock %}
</head>

<body class="layout">
  <header class="header">
    <div class="container row row--between">
      <strong class="text-lg">Sewalayan</strong>
      <nav class="row">
        <a href="/">Home</a>
        <a href="/about">About</a>
        {% if user.is_authenticated %}
          <a href="{% url 'user:me' %}">{{ user.username }}</a>
          <a href="{% url 'user:logout' %}">Keluar</a>
        {% else %}
          <a href="{% url 'user:login' %}">Masuk</a>
          <a class="btn btn--primary" href="{% url 'user:register' %}">Daftar</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <div class="alerts" aria-live="polite">
    {% for message in messages %}
      <div class="alert alert--{{ message.tags }}" role="alert">{{ message }}</div>
    {% endfor %}
  </div>

  <main class="layout__main">
    <div class="container container-padding">
        {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 Sewalayan.</div>
  </footer>

  <script>
    (function () {
      const DURATION = 4000; // lama tampil (ms)
      const container = document.querySelector('.alerts');

      function dismiss(el) {
        el.classList.add('alert--hide');
        setTimeout(function () { el.remove(); }, 300);
      }

      function watch(el) {
        el.addEventListener('click', function () { dismiss(el); });
        setTimeout(function () { dismiss(el); }, DURATION);
      }

      container.querySelectorAll('.alert').forEach(watch);

      // Bisa dipanggil dari JS halaman mana pun: showToast("Tersimpan!", "success")
      window.showToast = function (text, type) {
        const el = document.createElement('div');
        el.className = 'alert alert--' + (type || 'success');
        el.setAttribute('role', 'alert');
        el.textContent = text; // textContent: aman dari XSS
        container.appendChild(el);
        watch(el);
      };
    })();
  </script>
</body>

</html>
