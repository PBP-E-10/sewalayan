{% extends 'review/base_review.html' %}

{% block titel %}
    {% if is_edit %}
        Edit Ulasan
    {% else %}
        Tulis Ulasan
    {% endif %}
    | Sewalayan
{% endblock %}

{% block content %}
<h1>
    {% if is_edit %}
        Edit Ulasan
    {% else %}
        Tulis ulasan
    {% endif %}
</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        {% if is_edit %}
            Simpan Perubahan
        {% else %}
            Kirim Ulasan
        {% endif %}
    </button>
</form>

<a href="{% url 'review:show' %}">Kembali</a>
{% endblock %}
